name: Publish mods
on:
  push:
    tags: ['v*', 'horror-kids-v*']
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check release version
        run: |
          case "$GITHUB_REF_NAME" in
            horror-kids-v*) mod=horror-kids ;;
            v*) mod=kit-crafting ;;
            *) exit 1 ;;
          esac
          test "$GITHUB_REF_NAME" = "$(make -s tag MOD="$mod")"
      - run: make test site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
